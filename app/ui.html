<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תמלול עברית</title>
<style>
  :root {
    --bg: #111317; --panel: #181b21; --panel2: #1e222a; --line: #2a2f39;
    --text: #e7e9ee; --muted: #8b93a3; --accent: #4f8cff; --accent2: #3a6fd8;
    --ok: #3fb97a; --err: #e5534b; --warn: #d8a43a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 12px; border-radius: 999px; background: var(--panel2);
    border: 1px solid var(--line); font-size: 13px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
  .dot.busy { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  button {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #262b35; border-color: #39404d; }
  button.primary { background: var(--accent2); border-color: var(--accent2); }
  button.primary:hover { background: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  main { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  aside {
    border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  #drop {
    margin: 16px; padding: 26px 16px; border: 2px dashed #353b47; border-radius: 12px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: rgba(79,140,255,.06); }
  #drop .big { font-size: 16px; font-weight: 600; margin: 8px 0 4px; }
  #drop .small { color: var(--muted); font-size: 13px; }
  #drop svg { color: var(--accent); }
  #list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .job {
    padding: 11px 12px; border-radius: 10px; margin-bottom: 6px; cursor: pointer;
    border: 1px solid transparent; transition: background .12s;
  }
  .job:hover { background: var(--panel2); }
  .job.sel { background: var(--panel2); border-color: var(--line); }
  .job .row { display: flex; align-items: center; gap: 8px; }
  .job .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .job .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .job .x { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 16px; }
  .job .x:hover { color: var(--text); }
  .bar { height: 4px; background: #2a2f39; border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .job.done .bar > i { background: var(--ok); }
  .job.error .bar > i { background: var(--err); width: 100% !important; }
  aside .foot { padding: 12px 16px; border-top: 1px solid var(--line); }
  aside .foot button { width: 100%; }
  section { display: flex; flex-direction: column; min-height: 0; }
  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 12px 24px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar .meta { color: var(--muted); font-size: 13px; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
  #text {
    flex: 1; overflow-y: auto; padding: 22px 28px 40px; font-size: 17px; line-height: 1.9;
    white-space: pre-wrap; user-select: text;
  }
  #text .seg { display: block; padding: 1px 0; }
  #text .t { color: var(--muted); font: 12px/1 Consolas, monospace; margin-left: 10px; direction: ltr; unicode-bidi: isolate; }
  #text.hide-ts .t { display: none; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 15px; }
  .empty b { color: var(--text); font-weight: 600; display: block; font-size: 18px; margin-bottom: 6px; }
  .errbox { color: var(--err); padding: 22px 28px; }
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #262b35; border: 1px solid var(--line); padding: 9px 18px; border-radius: 8px;
    opacity: 0; transition: .2s; pointer-events: none;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #gone {
    position: fixed; inset: 0; background: rgba(17,19,23,.92); display: none;
    align-items: center; justify-content: center; text-align: center; font-size: 16px;
  }
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
  <h1>תמלול עברית</h1>
  <span class="sub">Whisper large-v3 · ivrit-ai · ללא אינטרנט</span>
  <span class="spacer"></span>
  <span class="pill"><span id="mdot" class="dot busy"></span><span id="mtext">טוען מודל…</span></span>
</header>
<main>
  <aside>
    <div id="drop">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <div class="big">גררו לכאן קבצי שמע או וידאו</div>
      <div class="small">או לחצו לבחירה · mp3, wav, m4a, mp4, mov, mkv…</div>
      <input id="pick" type="file" multiple hidden accept="audio/*,video/*,.mxf,.mts,.amr,.opus">
    </div>
    <div id="list"></div>
    <div class="foot"><button id="openFolder">פתיחת תיקיית התוצאות</button></div>
  </aside>
  <section>
    <div class="toolbar">
      <span class="title" id="tTitle">—</span>
      <span class="meta" id="tMeta"></span>
      <span class="spacer"></span>
      <label class="toggle"><input type="checkbox" id="ts"> זמנים</label>
      <button id="copy" disabled>העתקה</button>
      <button id="dlTxt" disabled>הורדת TXT</button>
      <button id="dlSrt" class="primary" disabled>הורדת כתוביות SRT</button>
    </div>
    <div id="text" class="hide-ts"><div class="empty"><b>אין עדיין תמלול</b>גררו קובץ לחלון כדי להתחיל. כל הקבצים נשמרים גם בתיקיית התוצאות.</div></div>
  </section>
</main>
<div id="toast"></div>
<div id="gone"><div>התוכנה נסגרה.<br><span style="color:var(--muted)">כדי להמשיך, הפעילו שוב את HEBREW-WHISPER.bat</span></div></div>
<script>
const $ = s => document.querySelector(s);
let jobs = [], sel = null, model = {}, lastRendered = "", fails = 0;
const uploads = {};  // temp id -> {name, size, pct}

function fmtTime(s) {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
}
function fmtSize(b) { return b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(1) + " MB"; }
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 1800); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function stateText(j) {
  if (j.uploading) return "מעלה… " + Math.round(j.pct) + "%";
  if (j.state === "queued") return "ממתין בתור";
  if (j.state === "running") return "מתמלל… " + Math.round(j.progress || 0) + "%";
  if (j.state === "done") return "הסתיים · " + fmtTime(j.duration) + " שמע ב-" + fmtTime(j.seconds) + (j.device === "cpu" ? " · מעבד" : "");
  if (j.state === "error") return "שגיאה";
  return "";
}

function renderList() {
  const all = [...Object.values(uploads), ...jobs.slice().reverse()];
  $("#list").innerHTML = all.map(j => {
    const pct = j.uploading ? j.pct : (j.state === "done" ? 100 : (j.progress || 0));
    const cls = ["job", j.state || "", j.id === sel ? "sel" : ""].join(" ");
    return `<div class="${cls}" data-id="${j.id}">
      <div class="row"><span class="name" title="${esc(j.name)}">${esc(j.name)}</span>
      ${j.uploading || j.state === "running" ? "" : `<button class="x" data-rm="${j.id}" title="הסרה מהרשימה">×</button>`}</div>
      <div class="meta">${stateText(j)} · ${fmtSize(j.size)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

function renderText() {
  const j = jobs.find(x => x.id === sel);
  const can = j && j.state === "done";
  for (const b of ["#copy", "#dlTxt", "#dlSrt"]) $(b).disabled = !can;
  if (!j) {
    $("#tTitle").textContent = "—"; $("#tMeta").textContent = "";
    if (lastRendered !== "empty") {
      $("#text").innerHTML = '<div class="empty"><b>אין עדיין תמלול</b>גררו קובץ לחלון כדי להתחיל. כל הקבצים נשמרים גם בתיקיית התוצאות.</div>';
      lastRendered = "empty";
    }
    return;
  }
  $("#tTitle").textContent = j.name;
  $("#tMeta").textContent = stateText(j);
  const key = j.id + ":" + j.state + ":" + j.segments.length;
  if (key === lastRendered) return;
  lastRendered = key;
  const box = $("#text");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  if (j.state === "error") { box.innerHTML = `<div class="errbox">${esc(j.error || "שגיאה")}</div>`; return; }
  if (!j.segments.length) {
    box.innerHTML = `<div class="empty"><b>${j.state === "queued" ? "ממתין בתור…" : "מתמלל…"}</b>הטקסט יופיע כאן תוך כדי.</div>`;
    return;
  }
  box.innerHTML = j.segments.map(s => `<span class="seg"><span class="t">${fmtTime(s[0])}</span>${esc(s[2])}</span>`).join("");
  if (j.state === "running" && atBottom) box.scrollTop = box.scrollHeight;
}

async function poll() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const d = await r.json();
    fails = 0; $("#gone").style.display = "none";
    model = d.model; jobs = d.jobs;
    const dot = $("#mdot"), t = $("#mtext");
    dot.className = "dot";
    if (model.model === "loading") { dot.classList.add("busy"); t.textContent = "טוען מודל…"; }
    else if (model.model === "error") { dot.classList.add("err"); t.textContent = "שגיאה בטעינת המודל"; t.title = model.error || ""; }
    else { dot.classList.add("ok"); t.textContent = model.device === "cuda" ? "מוכן · כרטיס גרפי" : "מוכן · מעבד (איטי)"; }
    if (jobs.some(j => j.state === "running")) dot.classList.add("busy");
    if (!sel || !jobs.find(j => j.id === sel)) {
      const run = jobs.find(j => j.state === "running") || jobs[jobs.length - 1];
      sel = run ? run.id : null;
    }
    renderList(); renderText();
  } catch (e) {
    if (++fails > 3) $("#gone").style.display = "flex";
  }
}

function upload(file) {
  const tmp = "u" + Math.random().toString(36).slice(2);
  uploads[tmp] = { id: tmp, name: file.name, size: file.size, pct: 0, uploading: true };
  renderList();
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload?name=" + encodeURIComponent(file.name));
  xhr.upload.onprogress = e => { if (e.lengthComputable) { uploads[tmp].pct = 100 * e.loaded / e.total; renderList(); } };
  xhr.onload = () => {
    delete uploads[tmp];
    try { const d = JSON.parse(xhr.responseText); if (d.id) { sel = d.id; lastRendered = ""; } else toast("העלאה נכשלה"); }
    catch (e) { toast("העלאה נכשלה"); }
    poll();
  };
  xhr.onerror = () => { delete uploads[tmp]; toast("העלאה נכשלה"); renderList(); };
  xhr.send(file);
}
function addFiles(list) { for (const f of list) if (f.size > 0) upload(f); }

const drop = $("#drop");
drop.onclick = () => $("#pick").click();
$("#pick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
for (const ev of ["dragenter", "dragover"]) document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); });
for (const ev of ["dragleave", "drop"]) document.addEventListener(ev, e => { e.preventDefault(); if (ev === "drop" || !e.relatedTarget) drop.classList.remove("over"); });
document.addEventListener("drop", e => addFiles(e.dataTransfer.files));

$("#list").onclick = async e => {
  const rm = e.target.closest("[data-rm]");
  if (rm) {
    e.stopPropagation();
    await fetch("/api/remove?id=" + rm.dataset.rm, { method: "POST" });
    if (sel === rm.dataset.rm) sel = null;
    lastRendered = ""; poll(); return;
  }
  const j = e.target.closest(".job");
  if (j && !j.dataset.id.startsWith("u")) { sel = j.dataset.id; lastRendered = ""; renderList(); renderText(); }
};
$("#ts").onchange = e => $("#text").classList.toggle("hide-ts", !e.target.checked);
$("#copy").onclick = async () => {
  const j = jobs.find(x => x.id === sel); if (!j) return;
  const txt = j.segments.map(s => ($("#ts").checked ? "[" + fmtTime(s[0]) + "] " : "") + s[2]).join("\n");
  try { await navigator.clipboard.writeText(txt); }
  catch (e) { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast("הטקסט הועתק");
};
$("#dlTxt").onclick = () => { location.href = "/api/download?fmt=txt&id=" + sel; };
$("#dlSrt").onclick = () => { location.href = "/api/download?fmt=srt&id=" + sel; };
$("#openFolder").onclick = () => fetch("/api/open-folder");

poll(); setInterval(poll, 1000);
</script>
</body>
</html>
